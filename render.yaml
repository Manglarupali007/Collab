# render.yaml - Root folder mein
services:
  - type: web
    name: nexus-backend
    env: node
    buildCommand: npm install --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
    plan: free